<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" fill="none">
  <defs>
    <style>
      .logo-text {
        font-family: 'Space Grotesk', Arial, Helvetica, sans-serif;
        font-style: italic;
        font-weight: 900;
        letter-spacing: -0.01em;
      }
    </style>
  </defs>
  <g transform="translate(10, 0)">
    <!-- Left Solid Wedge of A -->
    <path d="M 68 8 L 92 8 L 46 92 L 18 92 Z" fill="#00873d" />
    <!-- Center Spine / shadow -->
    <path d="M 94 8 L 102 8 L 74 92 L 66 92 Z" fill="#00873d" opacity="0.85" />
    <!-- Outer offset underline shadow under E -->
    <path d="M 72 92 L 70 96 L 138 96 L 140 92 Z" fill="#00873d" />
    <!-- The E with green border and white fill -->
    <polygon points="86,12 152,12 149,27 108,27 104,44 144,44 141,59 101,59 97,76 146,76 143,91 75,91" fill="#ffffff" stroke="#00873d" stroke-width="4" stroke-linejoin="miter" stroke-miterlimit="4" />
  </g>
  <g fill="#00873d" class="logo-text">
    <text x="180" y="23" font-size="24" class="logo-text">ACTION</text>
    <text x="180" y="47" font-size="23" class="logo-text">ELECTRICAL &amp;</text>
    <text x="180" y="71" font-size="23" class="logo-text">MECHANICAL</text>
    <text x="180" y="95" font-size="23" class="logo-text">CONTRACTORS</text>
  </g>
</svg>
